[project]
name = "brickkit"
version = "0.1.0"
description = "Building blocks for Databricks Unity Catalog governance"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Casper" }]
keywords = [
    "databricks",
    "unity-catalog",
    "governance",
    "data-governance",
    "pydantic",
    "sdk",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==2.12.5",
    "databricks-sdk==0.96.0",
    "databricks-vectorsearch==0.66",
    "loguru==0.7.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "claudetracing>=0.2.0, <1",
    "pre-commit>=4.5.1,<5",
    "databricks-connect>=17.3,<18",
    "ipykernel>=7.2.0,<8",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brickkit", "src/brickkit_tools"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.5,<1",
    "ty>=0.0.21,<1",
    "pytest>=9.0.2,<10",
    "pytest-cov>=7.0.0,<8",
    "pre-commit>=4.5.1,<5",
]
notebook = [
    "databricks-connect>=17.3,<18",
    "ipykernel>=7.2.0,<8",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "-ra"]
markers = [
    "unit: Unit tests (no Databricks connection)",
    "integration: Integration tests (real Databricks)",
    "slow: Long-running tests (VS provisioning, etc.) - skipped by default with '-m \"not slow\"'",
]
